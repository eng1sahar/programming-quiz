<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة الاختبارات التفاعلية</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --correct: #22c55e;
      --wrong: #ef4444;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* القائمة الجانبية */
    #sidebar { width: 220px; background: #020617; border-left: 1px solid #334155; padding: 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex-shrink: 0; }
    #sidebar h3 { color: var(--accent); margin-top: 0; text-align: center; font-size: 1.1rem; }
    .lec-btn { background: #1e293b; color: white; border: 1px solid #334155; padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: right; transition: 0.2s; font-size: 0.95rem; }
    .lec-btn:hover, .lec-btn.active { background: var(--accent); color: #000; font-weight: bold; }

    /* المنطقة الرئيسية */
    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 12px 20px; border-bottom: 1px solid #334155; background: #0f172a; display: flex; justify-content: space-between; align-items: center; }

    #workspace { flex: 1; display: flex; padding: 20px; gap: 20px; overflow: hidden; }

    /* لوحة الكود الرئيسي للمحاضرة (تظهر فقط إذا كان هناك كود رئيسي مبنية عليه الأسئلة) */
    #main-code-panel { flex: 1; background: #050811; border: 1px solid #334155; border-radius: 12px; padding: 15px; overflow-y: auto; display: none; direction: ltr; text-align: left; }
    #main-code-text { font-family: 'Consolas', monospace; color: #a5f3fc; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }

    /* لوحة الأسئلة */
    #quiz-panel { flex: 1; background: var(--bg); overflow-y: auto; padding-left: 5px; }

    /* بطاقة السؤال */
    .q-card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .q-title { font-size: 1.1rem; color: #ffffff; font-weight: bold; margin-bottom: 12px; line-height: 1.6; }

    /* صندوق كود فرعي للسؤال المحدد */
    .sub-code-box { background: #050811; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin: 10px 0; direction: ltr; text-align: left; font-family: 'Consolas', monospace; color: #a5f3fc; overflow-x: auto; white-space: pre-wrap; font-size: 0.9rem; }

    /* الأزرار التفاعلية */
    .options-grid { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .option-btn { width: 100%; text-align: right; background: #0f172a; color: var(--text); border: 1px solid #334155; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
    .option-btn:hover { background: #334155; }
    .option-btn.selected { border: 2px solid var(--accent); background: #1e3a8a; }
    .option-btn.correct { background: var(--correct) !important; color: white; font-weight: bold; }
    .option-btn.wrong { background: var(--wrong) !important; color: white; }

    /* الشرح والأزرار */
    .explanation { margin-top: 12px; padding: 12px; background: #0f172a; border-radius: 8px; border-right: 4px solid var(--accent); display: none; color: #cbd5e1; font-size: 0.9rem; line-height: 1.5; }
    .check-btn { background: var(--accent); color: #000; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 8px; transition: 0.2s; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h3>المحاضرات (1-12)</h3>
    <div id="lec-btns"></div>
  </div>

  <div id="main">
    <div id="header">
      <h2 id="title" style="margin:0; font-size: 1.2rem; color: var(--accent);">اختر محاضرة للبدء</h2>
    </div>

    <div id="workspace">
      <!-- يظهر فقط في حال كان الكود رئيسي ومبنية عليه كل الأسئلة -->
      <div id="main-code-panel">
        <div style="color: var(--accent); font-weight: bold; margin-bottom: 10px; font-family: sans-serif;">الكود البرمجي الرئيسي للمحاضرة:</div>
        <pre><code id="main-code-text"></code></pre>
      </div>

      <div id="quiz-panel">
        <div id="questions-container" style="text-align: center; color: #94a3b8; margin-top: 50px;">اختر محاضرة من القائمة الجانبية لعرض الأسئلة...</div>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('lec-btns');
    for(let i=1; i<=12; i++) {
      const btn = document.createElement('button');
      btn.className = 'lec-btn';
      btn.innerText = `المحاضرة ${i}`;
      btn.onclick = () => loadLec(i, btn);
      container.appendChild(btn);
    }

    async function loadLec(num, btnElement) {
      document.querySelectorAll('.lec-btn').forEach(b => b.classList.remove('active'));
      if(btnElement) btnElement.classList.add('active');

      document.getElementById('title').innerText = `المحاضرة ${num}`;
      const qContainer = document.getElementById('questions-container');
      qContainer.innerHTML = 'جاري التحضير والتنسيق...';

      try {
        const res = await fetch(`lec${num}.md`);
        const text = await res.text();
        parseSmartQuiz(text);
      } catch(e) {
        qContainer.innerHTML = 'تعذر تحميل ملف المحاضرة.';
      }
    }

    function parseSmartQuiz(text) {
      const qContainer = document.getElementById('questions-container');
      qContainer.innerHTML = '';

      // 1. فحص هل يوجد كود رئيسي في بداية الملف قبل الأسئلة؟
      const firstQIndex = text.search(/السؤال\s*\d+|Question\s*\d+/i);
      const headerArea = firstQIndex !== -1 ? text.substring(0, firstQIndex) : '';
      const mainCodeMatch = headerArea.match(/```(?:cpp|c|java|python)?([\s\S]*?)```/i);

      const mainCodePanel = document.getElementById('main-code-panel');
      if (mainCodeMatch && mainCodeMatch[1].trim().length > 15) {
        mainCodePanel.style.display = 'block';
        document.getElementById('main-code-text').innerText = mainCodeMatch[1].trim();
      } else {
        mainCodePanel.style.display = 'none';
      }

      // 2. تقسيم باقي المستند إلى أسئلة
      const questionsText = firstQIndex !== -1 ? text.substring(firstQIndex) : text;
      const blocks = questionsText.split(/(?=السؤال\s*\d+|Question\s*\d+)/i);

      blocks.forEach((block) => {
        if(!block.trim() || (!block.includes('A-') && !block.includes('A.'))) return;

        const card = document.createElement('div');
        card.className = 'q-card';

        // استخراج كود خاص بالسؤال إن وجد
        const subCodeMatch = block.match(/```(?:cpp|c|java|python)?([\s\S]*?)```/i);

        // استخراج العنوان وتنظيفه
        let questionTitle = block.split(/\n[A-D][-.\)]/)[0];
        questionTitle = questionTitle.replace(/```[\s\S]*?```/g, '').trim();

        const qTitleDiv = document.createElement('div');
        qTitleDiv.className = 'q-title';
        qTitleDiv.innerHTML = marked.parse(questionTitle);
        card.appendChild(qTitleDiv);

        // عرض كود السؤال المخصص إذا كان موجوداً
        if (subCodeMatch && subCodeMatch[1].trim()) {
          const subCodeBox = document.createElement('div');
          subCodeBox.className = 'sub-code-box';
          subCodeBox.innerText = subCodeMatch[1].trim();
          card.appendChild(subCodeBox);
        }

        // الأزرار والخيارات
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-grid';

        const lines = block.split('\n');
        lines.forEach(line => {
          const optMatch = line.match(/^([A-D])[-.\)]\s*(.*)/i);
          if (optMatch) {
            const letter = optMatch[1].toUpperCase();
            const optContent = optMatch[2].replace(/الإجابة الصحيحة[\s\S]*/i, '').trim();
            
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.setAttribute('data-letter', letter);
            btn.innerText = `${letter}- ${optContent}`;
            btn.onclick = () => selectOpt(btn);
            optionsDiv.appendChild(btn);
          }
        });
        card.appendChild(optionsDiv);

        // الإجابة الشرح
        const correctMatch = block.match(/الإجابة الصحيحة:\s*([A-D])/i);
        const correctAnswer = correctMatch ? correctMatch[1].toUpperCase() : null;

        const expMatch = block.match(/الشرح:\s*([\s\S]*)/i);
        const expText = expMatch ? expMatch[1].trim() : '';

        const expDiv = document.createElement('div');
        expDiv.className = 'explanation';
        expDiv.innerHTML = `<strong>الإجابة الصحيحة: ${correctAnswer || ''}</strong><br>${expText}`;
        card.appendChild(expDiv);

        // زر التأكيد
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'check-btn';
        confirmBtn.innerText = 'تأكيد الإجابة';
        confirmBtn.onclick = () => checkOpt(card, correctAnswer, expDiv);
        card.appendChild(confirmBtn);

        qContainer.appendChild(card);
      });
    }

    function selectOpt(btn) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function checkOpt(card, correctLetter, expDiv) {
      const selected = card.querySelector('.option-btn.selected');
      if (!selected) { alert('الرجاء اختيار إجابة أولاً!'); return; }

      const userChoice = selected.getAttribute('data-letter');
      const allOptions = card.querySelectorAll('.option-btn');

      allOptions.forEach(opt => {
        const letter = opt.getAttribute('data-letter');
        if (letter === correctLetter) {
          opt.classList.add('correct');
        } else if (letter === userChoice && userChoice !== correctLetter) {
          opt.classList.add('wrong');
        }
      });

      if(expDiv) expDiv.style.display = 'block';
    }
  </script>
</body>
</html>
